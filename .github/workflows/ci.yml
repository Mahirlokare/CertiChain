name: CertiChain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install contract dependencies
        run: npm install
      - name: Report contract toolchain vulnerabilities
        run: |
          npm audit --json > /tmp/root-audit.json || true
          node -e "const a=require('/tmp/root-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))"
      - name: Compile contracts
        run: npm run compile
      - name: Run smart-contract tests
        run: npm test
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Report frontend toolchain vulnerabilities
        working-directory: frontend
        run: |
          npm audit --json > /tmp/frontend-audit.json || true
          node -e "const a=require('/tmp/frontend-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, 'direct='+v.isDirect, 'fix='+JSON.stringify(v.fixAvailable))"
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check frontend bundle output
        working-directory: frontend
        run: test -s dist/index.html
      - name: Smoke test production preview
        working-directory: frontend
        run: npm run smoke
