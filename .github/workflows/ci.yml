name: CertiChain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install contract dependencies
        run: npm install
      - name: Compile contracts
        run: npm run compile
      - name: Run smart-contract tests
        run: npm test
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check frontend bundle output
        working-directory: frontend
        run: test -s dist/index.html
      - name: Smoke test production preview
        working-directory: frontend
        run: npm run smoke
